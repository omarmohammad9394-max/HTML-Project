<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Product Details – PrimeVault</title>
<link rel="stylesheet" href="css/style.css">

<style>
/* small page-specific styles to make the details page premium */
.details-wrapper {
  max-width: 1100px;
  margin: 36px auto;
  display: grid;
  grid-template-columns: 460px 1fr;
  gap: 32px;
  align-items: start;
}

.details-image-box {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height: 420px;
}

.details-image-box img {
  max-width: 100%;
  max-height: 420px;
  border-radius: 10px;
  object-fit: contain;
}

/* right column */
.details-right {
  background: white;
  padding: 26px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.product-title {
  margin: 0 0 6px;
  font-size: 28px;
  letter-spacing: -0.5px;
}

.price-rating-row {
  display:flex;
  align-items:center;
  gap: 18px;
  margin: 10px 0 18px;
}

.price-tag {
  font-size: 22px;
  color: #e65a00;
  font-weight: 800;
}

/* Average rating display */
.rating-box {
  display:flex;
  align-items:center;
  gap:8px;
}
.avg-stars {
  display:flex;
  gap:6px;
  align-items:center;
}
.avg-stars .star {
  font-size: 28px;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.12));
}

/* interactive rating input */
.interactive-rating {
  display:flex;
  align-items:center;
  gap:12px;
  margin: 14px 0;
}
.star-input {
  display:flex;
  gap:6px;
  cursor:pointer;
}
.star-input .star {
  font-size: 30px;
  transition: transform .08s ease, color .12s ease;
  user-select: none;
}
.star-input .star:hover { transform: translateY(-4px) scale(1.06); }
.star-input .star.active { color: #ffbf00; transform: translateY(-2px); }

/* cart section */
.cart-section { margin: 18px 0; display:flex; gap:12px; align-items:center; }
.qty { width: 80px; padding:10px; border-radius:8px; border:1px solid #ddd; }

/* reviews */
.reviews-section { margin-top: 22px; }
.reviews-list { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
.review-card {
  padding:14px;
  border-radius:10px;
  background:#fafafa;
  border:1px solid #f0f0f0;
  box-shadow: 0 6px 14px rgba(0,0,0,0.02);
}
.review-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
.review-stars { color:#ffbf00; font-size:16px; }
.review-text { margin:6px 0 8px; color:#333; }
.review-time { font-size:12px; color:#888; }

/* review input */
.review-box { width:100%; min-height:88px; padding:12px; border-radius:10px; border:1px solid #ddd; resize:vertical; }

/* buttons */
.add-cart-btn, .submit-review-btn {
  padding:12px 16px;
  background:#000; color:#fff; border-radius:10px; border:none; cursor:pointer; font-weight:700;
}
.add-cart-btn:hover, .submit-review-btn:hover { background:#e65a00; transform:translateY(-2px); transition:all .12s; }

/* responsive */
@media (max-width:980px) {
  .details-wrapper { grid-template-columns: 1fr; padding:20px; }
  .details-image-box { min-height:260px; }
}
</style>
</head>
<body>
<!-- NAVBAR -->
<header class="navbar">

    <!-- LEFT — LOGO -->
    <a href="index.html" class="nav-logo">
        <img src="images/Logo.png" alt="PrimeVault">
    </a>

    <!-- CENTER — LINKS -->
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>

    <!-- RIGHT — USER + CART -->
    <div class="nav-right">

        <!-- Username appears dynamically -->
        <span id="nav-username" class="username"></span>

        <!-- Login + Signup (hidden when logged in) -->
        <div id="auth-buttons">
            <a href="login.html" class="nav-btn">Login</a>
            <a href="signup.html" class="nav-btn">Sign Up</a>
        </div>

        <!-- CART ICON -->
        <div class="cart-icon" onclick="location.href='cart.html'">
            <img src="images/Cart.png" alt="Cart">
            <span id="cart-count">0</span>
        </div>

        <!-- MOBILE MENU BUTTON -->
        <button class="hamburger" onclick="toggleMenu()">☰</button>

    </div>

</header>

<!-- MOBILE DROPDOWN MENU -->
<div id="mobileMenu" class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="login.html" id="mobile-login">Login</a>
    <a href="signup.html" id="mobile-signup">Sign Up</a>
</div>

<!-- PRODUCT DETAILS -->
<div class="details-wrapper">

  <!-- LEFT: IMAGE -->
  <div class="details-left">
    <div class="details-image-box">
      <img id="details-image" alt="Product Image" src="">
    </div>
  </div>

  <!-- RIGHT: INFO -->
  <div class="details-right">
    <h1 id="details-title" class="product-title">—</h1>

    <div class="price-rating-row">
      <p id="details-price" class="price-tag">—</p>

      <div class="rating-box">
        <div class="avg-stars" id="avg-stars" aria-hidden="true"></div>
        <div id="avg-score" style="font-weight:700;color:#333">—</div>
        <div style="color:#888;font-size:13px;margin-left:6px" id="reviews-count"> — reviews</div>
      </div>
    </div>

    <p id="details-description" class="product-description" style="color:#444;line-height:1.6">—</p>

    <!-- interactive rating input -->
    <div class="interactive-rating">
      <div style="font-weight:600;color:#333">Your rating:</div>
      <div class="star-input" id="star-input" role="radiogroup" aria-label="Rate product">
        <!-- stars inserted by JS -->
      </div>
      <div id="your-rating-label" style="color:#666;font-size:14px">0 / 5</div>
    </div>

    <!-- add to cart -->
    <div class="cart-section">
      <input type="number" id="quantity" value="1" min="1" class="qty" />
      <button class="add-cart-btn" id="btn-add-cart">🛒 Add to Cart</button>
    </div>

    <!-- reviews -->
    <div class="reviews-section">
      <h2 style="margin:0 0 8px">Customer Reviews</h2>

      <div id="details-reviews" class="reviews-list"></div>

      <div style="margin-top:12px">
        <textarea id="newReview" class="review-box" placeholder="Write your review..."></textarea>
        <div style="display:flex;gap:10px;margin-top:10px;align-items:center;">
          <button class="submit-review-btn" id="btn-submit-review">Submit Review</button>
          <div style="color:#666;font-size:13px">You can change your rating before submitting.</div>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
