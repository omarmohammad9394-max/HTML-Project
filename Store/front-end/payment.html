<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment – PrimeVault</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js"></script>

<style>
/* ------------ GLOBAL PAGE LOOK ------------ */
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f7;
    margin: 0;
    padding: 0;
}

/* ------------ NAVBAR ------------ */
.navbar {
    background: #111;
    color: #fff;
    padding: 14px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.nav-links a { margin: 0 12px; }

/* ------------ PAYMENT BOX ------------ */
.payment-wrapper {
    max-width: 500px;
    background: #fff;
    margin: 40px auto;
    padding: 30px 35px;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}
.payment-wrapper h2 {
    margin: 0 0 20px;
    font-size: 24px;
    font-weight: 700;
}

label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }

input[type=text], input[type=password] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid #ccc;
    background: #fafafa;
    transition: .2s;
}
input:focus { border-color: #111; background: #fff; }

.card-input-wrapper { position: relative; width: 100%; }
.card-inline-logo {
    width: 40px;
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
}

.small-row { display: flex; gap: 16px; margin-top: 15px; }

.btn {
    width: 100%; background: #111; color: #fff;
    padding: 14px 20px; border-radius: 10px;
    border: none; font-size: 17px; font-weight: 700;
    margin-top: 22px; cursor: pointer;
}
.btn:hover { background: #333; }

.error { color:#c0392b; display:none; margin-top:12px; }

/* Loading overlay */
#loadingOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    visibility:hidden; opacity:0; transition:.25s;
}
#loadingOverlay.show { visibility:visible; opacity:1; }
.loading-box {
    background:#fff; padding:25px 35px;
    border-radius:12px; text-align:center;
}
.spinner {
    width:45px; height:45px;
    border:5px solid #eee;
    border-top-color:#000;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:15px auto;
}
@keyframes spin { to{ transform:rotate(360deg); } }
</style>
</head>

<body>

<header class="navbar">
    <a href="index.html" class="nav-logo">
        <img src="images/Logo.png" alt="PrimeVault">
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>

    <div class="nav-right">
        <span id="nav-username" class="username"></span>
        <div id="auth-buttons">
            <a href="login.html" class="nav-btn">Login</a>
            <a href="signup.html" class="nav-btn">Sign Up</a>
        </div>
        <div class="cart-icon" onclick="location.href='cart.html'">
            <img src="images/Cart.png">
            <span id="cart-count">0</span>
        </div>
    </div>
</header>

<div class="payment-wrapper">

    <h2>Payment Details</h2>

    <div id="formError" class="error"></div>

    <label for="cardName">Cardholder Name</label>
    <input id="cardName" type="text" placeholder="John Doe">

    <label for="cardNumber">Card Number</label>
    <div class="card-input-wrapper">
        <input id="cardNumber" type="text" maxlength="19" placeholder="1234 5678 9012 3456">
        <img id="brandInlineLogo" class="card-inline-logo">
    </div>
    <div id="cardType" style="font-weight:600; margin:6px 0 12px;"></div>

    <div class="small-row">
        <div>
            <label for="expDate">Expiration (MM/YY)</label>
            <input id="expDate" type="text" maxlength="5" placeholder="MM/YY">
        </div>
        <div>
            <label for="cvv">CVV</label>
            <input id="cvv" type="password" maxlength="4" placeholder="123">
        </div>
    </div>

    <button id="payNow" class="btn">Pay Now</button>

</div>

<!-- Loading -->
<div id="loadingOverlay">
    <div class="loading-box">
        <strong>Processing Payment…</strong>
        <div class="spinner"></div>
    </div>
</div>

<script>
(() => {
  const cardInput = document.getElementById("cardNumber");
  const inlineLogo = document.getElementById("brandInlineLogo");
  const cardTypeBox = document.getElementById("cardType");
  const expInput = document.getElementById("expDate");
  const cvvInput = document.getElementById("cvv");
  const cardName = document.getElementById("cardName");
  const errorBox = document.getElementById("formError");
  const payBtn = document.getElementById("payNow");
  const loadingOverlay = document.getElementById("loadingOverlay");

  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (!cart.length) {
    alert("Your cart is empty.");
    location.href = "cart.html";
  }

  expInput.addEventListener("input", e => {
    let v = onlyDigits(e.target.value);

    // Auto-add slash after 2 digits
    if (v.length >= 3) {
        e.target.value = v.slice(0,2) + "/" + v.slice(2,4);
    } else {
        e.target.value = v; 
    }

    hideError();
});

  function showError(msg){ errorBox.style.display="block"; errorBox.textContent=msg; }
  function hideError(){ errorBox.style.display="none"; }

  function onlyDigits(s){ return (s||"").replace(/\D/g,""); }

  // CARD INPUT
  cardInput.addEventListener("input", e => {
    let digits = onlyDigits(e.target.value).slice(0,16);
    e.target.value = digits.replace(/(.{4})/g,"$1 ").trim();

    let brand = "";
    if (/^4/.test(digits)) brand = "Visa";
    else if (/^5/.test(digits)) brand = "mc";
    else if (/^2/.test(digits)) brand = "mc"
    else if (/^3/.test(digits)) brand = "amex";
    else if (/^6/.test(digits)) brand = "discover";

    cardTypeBox.textContent = brand;

    if (brand) {
      inlineLogo.src = "images/cards/" + brand.toLowerCase().replace(" ", "") + ".png";
      inlineLogo.style.display = "block";
    } else {
      inlineLogo.style.display = "none";
    }

    hideError();
  });

  // PAY BUTTON
  payBtn.addEventListener("click", async evt => {
    evt.preventDefault();
    hideError();

    const nameVal = cardName.value.trim();
    const rawCard = onlyDigits(cardInput.value);
    const expVal = expInput.value.trim();
    const cvvVal = onlyDigits(cvvInput.value);

    // VALIDATION
    if (!nameVal) return showError("Enter cardholder name.");
    if (!/^[345]\d{15}$/.test(rawCard))
      return showError("Card number must be 16 digits & start with 3, 4, or 5.");
    if (!/^\d{2}\/\d{2}$/.test(expVal))
      return showError("Expiration must be MM/YY.");

    const [MM, YY] = expVal.split("/").map(Number);
    const now = new Date();
    const curY = now.getFullYear() % 100;
    const curM = now.getMonth() + 1;

    if (MM < 1 || MM > 12) return showError("Invalid month.");
    if (YY < curY || (YY === curY && MM < curM))
      return showError("Card expired.");
    if (!/^\d{2,4}$/.test(cvvVal))
      return showError("CVV must be 2–4 digits.");

    // SHOW LOADING
    loadingOverlay.classList.add("show");

    // SEND TO BACKEND (in script.js)
    const success = await validatePayment();

    if (!success) {
      loadingOverlay.classList.remove("show");
      return showError("Payment failed.");
    }

    // validatePayment handles redirect
  });

})();
</script>

</body>
</html>
