<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Receipt - Order Confirmation</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;margin:0;padding:20px}
.container{max-width:820px;margin:30px auto;background:#fff;padding:22px;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,0.08)}
.header{display:flex;align-items:center;gap:16px}
.header img{width:92px;border-radius:8px}
.header h1{margin:0;font-size:22px}
.order-info{margin-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.order-info .left, .order-info .right{background:#fafafa;padding:12px;border-radius:8px}
.items{margin-top:18px;border-top:1px solid #eee;padding-top:12px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed #eee}
.item img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.summary{margin-top:18px;display:flex;justify-content:space-between;align-items:center}
.total{font-size:22px;font-weight:700}
.meta{font-size:13px;color:#666}
.btns{margin-top:18px;display:flex;gap:12px}
.btn{background:#000;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700}
.small{font-size:13px;color:#555}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <!-- local uploaded logo (session path) -->
    <img src="images/Logo.png" alt="Store Logo" onerror="this.style.display='none'">
    <div>
      <h1>Order Receipt</h1>
      <div class="small">Thank you for shopping with PrimeVault</div>
    </div>
  </div>

  <div id="orderArea"></div>

  <div class="btns">
    <a href="index.html" class="btn">Return Home</a>
    <a id="printBtn" class="btn" style="background:#e65a00">Print Receipt</a>
  </div>
</div>

<script>
(() => {
  const area = document.getElementById('orderArea');
  const raw = localStorage.getItem('lastOrder');
  if (!raw) {
    area.innerHTML = '<p style="padding:18px">No order found. Maybe you navigated here directly.</p>';
    return;
  }

  let order;
  try { order = JSON.parse(raw); } catch(e){ area.innerHTML = '<p>Invalid order data.</p>'; return; }

  // build items html
  let itemsHtml = '';
  order.items.forEach(it => {
    const qty = it.qty || 1;
    const price = Number(it.price) || 0;
    const subtotal = (price * qty).toFixed(2);
    const img = it.img || '';
    itemsHtml += `
      <div class="item">
        <img src="${img}" alt="${it.name}" onerror="this.style.display='none'">
        <div style="flex:1">
          <div style="font-weight:700">${it.name}</div>
          <div class="small">Qty: ${qty} — $${price.toFixed ? price.toFixed(2) : Number(price).toFixed(2)}</div>
        </div>
        <div style="text-align:right;font-weight:700">$${subtotal}</div>
      </div>
    `;
  });

  const date = new Date(order.datetime);
  const dateStr = date.toLocaleString();

  const maskedCard = order.cardLast4 ? '•••• •••• •••• ' + order.cardLast4 : order.cardLast4;

  area.innerHTML = `
    <div class="order-info">
      <div class="left">
        <div style="font-weight:700">Order ID</div>
        <div>${order.id}</div>
        <div class="small" style="margin-top:6px">Placed: ${dateStr}</div>
      </div>
      <div class="right">
        <div style="font-weight:700">Payment</div>
        <div class="small">${order.paymentMethod} • ${maskedCard}</div>
        <div class="small" style="margin-top:6px">Cardholder: ${order.cardHolder}</div>
      </div>
    </div>

    <div class="items">
      ${itemsHtml}
    </div>

    <div class="summary">
      <div class="meta">Items: ${order.items.length}</div>
      <div class="total">$${Number(order.total).toFixed(2)}</div>
    </div>
  `;

  document.getElementById('printBtn').addEventListener('click', () => window.print());
})();
</script>

</body>
</html>
