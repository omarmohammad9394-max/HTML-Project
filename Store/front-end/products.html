<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products – PrimeVault</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- NAVBAR -->
<header class="navbar">

    <!-- LEFT — LOGO -->
    <a href="index.html" class="nav-logo">
        <img src="images/Logo.png" alt="PrimeVault">
    </a>

    <!-- CENTER — LINKS -->
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>

    <!-- RIGHT — USER + CART -->
    <div class="nav-right">

        <!-- Username appears dynamically -->
        <span id="nav-username" class="username"></span>

        <!-- Login + Signup (hidden when logged in) -->
        <div id="auth-buttons">
            <a href="login.html" class="nav-btn">Login</a>
            <a href="signup.html" class="nav-btn">Sign Up</a>
        </div>

        <!-- CART ICON -->
        <div class="cart-icon" onclick="location.href='cart.html'">
            <img src="images/Cart.png" alt="Cart">
            <span id="cart-count">0</span>
        </div>

    </div>

</header>

<div class="page-header">
    <h1>Browse Categories</h1>
    <p>Select a category to explore our curated collections.</p>
</div>


<!-- CATEGORY GRID -->
<div class="category-grid">

    <a href="electronics.html" class="category-box">
        <img src="/back-end/product-images/electronics.jpg" alt="">
        <h3>Electronics</h3>
    </a>

    <a href="clothes.html" class="category-box">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="">
        <h3>Clothing</h3>
    </a>

    <a href="accessories.html" class="category-box">
        <img src="/back-end/product-images/accessories.jpg" alt="">
        <h3>Accessories</h3>
    </a>

</div>

<script src="js/script.js"></script>
</body>
</html>
