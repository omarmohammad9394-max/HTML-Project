<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body><!-- NAVBAR -->
<header class="navbar">

    <!-- LEFT — LOGO -->
    <a href="index.html" class="nav-logo">
        <img src="images/Logo.png" alt="PrimeVault">
    </a>

    <!-- CENTER — LINKS -->
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
    </nav>

    <!-- RIGHT — USER + CART -->
    <div class="nav-right">

        <!-- Username appears dynamically -->
        <span id="nav-username" class="username"></span>

        <!-- Login + Signup (hidden when logged in) -->
        <div id="auth-buttons">
            <a href="login.html" class="nav-btn">Login</a>
            <a href="signup.html" class="nav-btn">Sign Up</a>
        </div>

        <!-- CART ICON -->
        <div class="cart-icon" onclick="location.href='cart.html'">
            <img src="images/Cart.png" alt="Cart">
            <span id="cart-count">0</span>
        </div>

        <!-- MOBILE MENU BUTTON -->
        <button class="hamburger" onclick="toggleMenu()">☰</button>

    </div>

</header>

<!-- MOBILE DROPDOWN MENU -->
<div id="mobileMenu" class="mobile-menu">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="login.html" id="mobile-login">Login</a>
    <a href="signup.html" id="mobile-signup">Sign Up</a>
</div>


<div class="cart-container">

    <div class="cart-header">
        <h2>Your Cart</h2>
        <p>Review your items before checkout</p>
    </div>

    <div id="cartItems"></div>

    <h3 id="total" class="cart-total">Total: $0</h3>
    
<button class="btn" style="margin-top:20px; width:200px;" onclick="goToPayment()">
    Proceed to Payment
</button>

<script>
function goToPayment() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty! Add items before proceeding.");
        return;
    }

    // If not empty → go to payment page
    window.location.href = "payment.html";
}
</script>



</div>

<script src="js/script.js"></script>
</body>
</html>
